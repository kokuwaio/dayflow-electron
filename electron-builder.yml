# Packs the built app (out/):
# - Linux: dist/linux-unpacked, which the Flatpak manifest in flatpak/ wraps.
# - Windows: an NSIS installer per architecture (x64, arm64).
# - macOS: a dmg per architecture (arm64, x64).
# Windows and macOS builds are unsigned for now; docs/release.md says where
# the certificates plug in.
appId: io.github.kokuwaio.DayflowElectron
productName: dayflow-electron
executableName: dayflow-electron
artifactName: ${productName}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
protocols:
  - name: dayflow-electron
    schemes:
      - dayflow-electron
linux:
  target: dir
  category: Utility
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Keeps the recordings and the database; they live in %APPDATA%\dayflow-electron.
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  category: public.app-category.productivity
  # Ad-hoc signature: Apple silicon runs no unsigned code. To sign and
  # notarize, drop these two lines and set the variables in docs/release.md.
  identity: "-"
  hardenedRuntime: false
