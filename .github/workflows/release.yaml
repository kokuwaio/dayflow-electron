name: Release

# Publishing the release that Release Drafter prepared builds the app and
# attaches the Flatpak bundles (x86_64, aarch64), the Windows installers
# (x64, arm64) and the macOS disk images (arm64, x64), with SHA256SUMS.

permissions: read-all

on:
  release:
    types:
      - published

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml

  assets:
    name: Attach release assets
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        # The Flatpak bundle per architecture and the installers, renamed to carry the tag.
        run: |
          for arch in x86_64 aarch64; do
            cp "artifacts/dayflow-electron-flatpak-$arch/dayflow-electron.flatpak" "dayflow-electron-$TAG-$arch.flatpak"
          done
          # dayflow-electron-win-x64.exe -> dayflow-electron-<tag>-win-x64.exe, likewise for the dmg images.
          for file in artifacts/installers-windows/*.exe artifacts/installers-macos/*.dmg; do
            name="${file##*/}"
            cp "$file" "dayflow-electron-$TAG-${name#dayflow-electron-}"
          done
          sha256sum dayflow-electron-"$TAG"-* > SHA256SUMS

      - name: Upload to release
        run: gh release upload "$TAG" dayflow-electron-"$TAG"-* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
