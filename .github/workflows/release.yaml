name: Release

# Publishing the release that Release Drafter prepared builds the app and
# attaches, for x86_64 and aarch64, the Flatpak bundle and the tarball that
# the Flathub manifest (flatpak/flathub/) builds from.

permissions: read-all

on:
  release:
    types:
      - published

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml

  assets:
    name: Attach release assets
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Add the release to the metainfo
        run: scripts/metainfo-release.sh "${TAG#v}"

      - name: Create tarballs and bundles
        # Per architecture: everything the Flathub manifest installs, at the top level, and the Flatpak bundle.
        run: |
          for arch in x86_64 aarch64; do
            dir="release/$arch/dayflow-electron"
            mkdir -p "$dir"
            tar -C "$dir" -xzf "artifacts/app-$arch/app-$arch.tar.gz"
            install -m755 "artifacts/helper-$arch/dayflow-linux-helper" "$dir/dayflow-linux-helper"
            cp resources/icon.png flatpak/io.github.kokuwaio.DayflowElectron.desktop flatpak/io.github.kokuwaio.DayflowElectron.metainfo.xml "$dir/"
            tar -C "release/$arch" -czf "dayflow-electron-$TAG-linux-$arch.tar.gz" dayflow-electron
            cp "artifacts/dayflow-electron-flatpak-$arch/dayflow-electron.flatpak" "dayflow-electron-$TAG-$arch.flatpak"
          done
          sha256sum dayflow-electron-"$TAG"-* > SHA256SUMS

      - name: Upload to release
        run: gh release upload "$TAG" dayflow-electron-"$TAG"-* SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
