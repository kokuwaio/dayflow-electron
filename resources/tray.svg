<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tray icon (Linux, Windows): the app icon without the rays, on a
       full-size tile so it reads on light and dark panels. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)"/>
  <path d="M9 17a7 7 0 0 1 14 0z" fill="#fcd34d"/>
  <rect x="5" y="19" width="7" height="4" rx="1" fill="#fff"/>
  <rect x="14" y="19" width="9" height="4" rx="1" fill="#fff" fill-opacity=".6"/>
  <rect x="25" y="19" width="2" height="4" rx="1" fill="#fff"/>
</svg>
