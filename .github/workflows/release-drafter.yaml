name: Release Drafter

permissions: read-all

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  draft:
    name: Update release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Update release draft
        uses: release-drafter/release-drafter@v7
