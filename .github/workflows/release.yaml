name: Release

# Publishing the release that Release Drafter prepared builds the app and
# attaches, for x86_64 and aarch64, the Flatpak bundle and the tarball that
# the Flathub manifest (packaging/flatpak/flathub/) builds from, plus the
# Windows installers (x64, arm64), the macOS disk images (arm64, x64) and the
# Homebrew cask, which it also pushes to the kokuwaio/homebrew-tap repository.
# The update feeds (latest.yml, latest-mac.yml), the macOS update zips and the
# blockmaps are for electron-updater in the installed apps.

permissions: read-all

on:
  release:
    types:
      - published

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml

  assets:
    name: Attach release assets
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Add the release to the metainfo
        run: scripts/metainfo-release.sh "${TAG#v}"

      - name: Collect release files
        # Per architecture: everything the Flathub manifest installs, at the
        # top level, and the Flatpak bundle, both renamed to carry the tag. The
        # installers already carry it (electron-builder's artifactName) and keep
        # their names: the update feeds point at them by name.
        run: |
          for arch in x86_64 aarch64; do
            dir="release/$arch/dayflow-electron"
            mkdir -p "$dir"
            tar -C "$dir" -xzf "artifacts/app-$arch/app-$arch.tar.gz"
            install -m755 "artifacts/helper-$arch/dayflow-linux-helper" "$dir/dayflow-linux-helper"
            cp resources/icon.png resources/icon.svg packaging/flatpak/io.github.kokuwaio.DayflowElectron.desktop packaging/flatpak/io.github.kokuwaio.DayflowElectron.metainfo.xml "$dir/"
            tar -C "release/$arch" -czf "dayflow-electron-$TAG-linux-$arch.tar.gz" dayflow-electron
            cp "artifacts/dayflow-electron-flatpak-$arch/dayflow-electron.flatpak" "dayflow-electron-$TAG-$arch.flatpak"
          done
          for file in artifacts/installers-windows/* artifacts/installers-macos/*; do
            name="${file##*/}"
            case "$name" in
              latest.yml | latest-mac.yml | "dayflow-electron-$TAG-"*) cp "$file" . ;;
              *)
                echo "::error::$name does not carry the tag $TAG"
                exit 1
                ;;
            esac
          done
          sha256sum dayflow-electron-"$TAG"-* latest.yml latest-mac.yml > SHA256SUMS
          # The Homebrew cask for the two disk images (packaging/homebrew/).
          scripts/homebrew-cask.sh "${TAG#v}" "dayflow-electron-$TAG-mac-arm64.dmg" "dayflow-electron-$TAG-mac-x64.dmg" > dayflow-electron.rb

      - name: Upload to release
        # The feeds last, so installed apps never see a version whose files are missing.
        run: |
          gh release upload "$TAG" dayflow-electron-"$TAG"-* SHA256SUMS dayflow-electron.rb --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" latest.yml latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update the Homebrew tap
    needs:
      - assets
    # Prereleases keep their cask as a release file; the tap gets stable releases only.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # One tap update at a time, so overlapping releases cannot push out of order.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Update the Homebrew tap
        # Needs the kokuwaio/homebrew-tap repository and a token that may push to it (docs/release.md).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the cask is attached to the release only."
            exit 0
          fi
          # Only the latest stable release goes to the tap: re-running an older
          # release must not take new installs back to its version.
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest release ($latest); the tap keeps its cask."
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern dayflow-electron.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/kokuwaio/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp dayflow-electron.rb tap/Casks/dayflow-electron.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dayflow-electron.rb
          # A re-run with the same release has nothing new to commit.
          if git diff --cached --quiet; then
            echo "The tap already has this cask."
            exit 0
          fi
          git commit -m "dayflow-electron ${TAG#v}"
          git push
