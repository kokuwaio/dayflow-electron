name: CI

permissions: read-all

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find packaging changes
    runs-on: ubuntu-latest
    outputs:
      installers: ${{ steps.check.outputs.installers }}
    steps:
      - name: Check
        id: check
        # Pushes to main build the Windows and macOS installers; a pull request
        # only when it changes how they are built: the electron-builder config,
        # the workflows, resources/, scripts/, or the Electron packages in
        # package.json. The other PRs still run the tests on Windows and macOS.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "installers=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[]' > files.jsonl
          installers=false
          if jq -r '.filename' files.jsonl | grep -E '^(electron-builder\.yml|\.github/workflows/|resources/|scripts/)'; then
            installers=true
          fi
          if jq -r 'select(.filename == "package.json") | .patch // ""' files.jsonl | grep -E '^[-+][[:space:]]*"electron'; then
            installers=true
          fi
          echo "installers=$installers" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs:
      - changes
    uses: ./.github/workflows/build.yaml
    with:
      installers: ${{ needs.changes.outputs.installers == 'true' }}

  dependabot:
    name: Merge Dependabot update
    needs:
      - build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        # Runs only after the tests and the Flatpak build passed.
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update the release draft
        # A merge with GITHUB_TOKEN starts no push workflows on main, but a
        # workflow_dispatch does, so the update appears in the release notes.
        run: gh workflow run release-drafter.yaml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
