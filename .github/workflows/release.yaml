name: Release

# Publishing the release that Release Drafter prepared builds the app and
# attaches the Flatpak bundle and the tarball that the Flathub manifest
# (flatpak/flathub/) builds from.

permissions: read-all

on:
  release:
    types:
      - published

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml

  assets:
    name: Attach release assets
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create tarball
        # Everything the Flathub manifest installs, at the top level.
        run: |
          mkdir -p "release/dayflow-electron"
          tar -C release/dayflow-electron -xzf artifacts/app-linux-unpacked/app-linux-unpacked.tar.gz
          install -m755 artifacts/helper/dayflow-linux-helper release/dayflow-electron/dayflow-linux-helper
          cp resources/icon.png flatpak/io.github.kokuwaio.DayflowElectron.desktop flatpak/io.github.kokuwaio.DayflowElectron.metainfo.xml release/dayflow-electron/
          tar -C release -czf "dayflow-electron-$TAG-linux-x86_64.tar.gz" dayflow-electron
          cp "$(find artifacts -name 'dayflow-electron.flatpak' | head -n 1)" "dayflow-electron-$TAG-x86_64.flatpak"
          sha256sum dayflow-electron-"$TAG"-* > SHA256SUMS

      - name: Upload to release
        run: gh release upload "$TAG" dayflow-electron-"$TAG"-* SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
