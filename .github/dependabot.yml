# Weekly updates; minor and patch versions arrive grouped. CI merges an
# update once the TypeScript, Go and Flatpak jobs pass (.github/workflows/ci.yaml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /helper/linux
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
